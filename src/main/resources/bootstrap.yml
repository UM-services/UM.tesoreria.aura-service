app:
  port: ${APP_PORT:8098}
  logging: DEBUG
  name: tesoreria-aura-service
  consul:
    host: consul-service
    port: 8500
  swagger:
    username: ${APP_SWAGGER_USERNAME:tesoreria}
    password: ${APP_SWAGGER_PASSWORD:tesoreria}
  aura:
    base-url: ${APP_AURA_BASE_URL:https://services-dev.api.gire.com/aura/homologacion}
    client-id: ${APP_AURA_CLIENT_ID:}
    client-secret: ${APP_AURA_CLIENT_SECRET:}

server:
  port: ${app.port}

spring:
  application:
    name: ${app.name}
  cloud:
    consul:
      host: ${app.consul.host}
      port: ${app.consul.port}
      discovery:
        prefer-ip-address: true
        tags: tesoreria,aura
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 30000
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    um.tesoreria.aura: ${app.logging}
    web: ${app.logging}
    org:
      springframework.cloud.config: ${app.logging}

management:
  endpoints:
    web:
      exposure:
        include: health,scheduledtasks,env
  endpoint:
    health:
      show-details: always
